# Grafana Datasource Configuration

apiVersion: 1

datasources:
  - name: Prometheus
    uid: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 5000
      derivedFields:
        - name: request_id
          matcherType: label
          matcherRegex: request_id
          datasourceUid: Loki
          url: '{service="mcp"} | request_id=`$${__value.raw}`'
          urlDisplayLabel: 'All logs for this request'
