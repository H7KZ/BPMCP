# Reusable: build the MCP image and push to GHCR

name: Build image (reusable)

on:
  workflow_call:
    inputs:
      float_tag:
        description: 'Floating tag to push alongside the SHA (dev-latest | latest)'
        required: true
        type: string
    outputs:
      image_name:
        description: 'Registry image name without tag, e.g. ghcr.io/h7kz/BPMCP'
        value: ${{ jobs.build.outputs.image_name }}
      image_tag:
        description: 'Short SHA used as the immutable image tag'
        value: ${{ jobs.build.outputs.image_tag }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Metadata
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          NAME="ghcr.io/$(echo "$REPO" | tr 'A-Z' 'a-z')"
          TAG="${GITHUB_SHA::8}"
          {
            echo "image_name=$NAME"
            echo "image_tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Building $NAME:$TAG (+ ${{ inputs.float_tag }})"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_name }}:${{ inputs.float_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
