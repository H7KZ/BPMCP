# CD: Development Pipeline
#
# every merge to main builds the image once and auto-deploys it to the
# development environment. This is the artifact that later gets promoted
# to production unchanged (build once, deploy many)

name: Deploy Development

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'infra/**'
      - '.example/**'
      - 'README.md'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      float_tag: dev-latest
    secrets: inherit

  deploy:
    needs: build
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: development
      docs_image_name: ${{ needs.build.outputs.docs_image_name }}
      image_name: ${{ needs.build.outputs.image_name }}
      image_tag: ${{ needs.build.outputs.image_tag }}
      mcp_built: ${{ needs.build.outputs.mcp_built }}
    secrets: inherit
