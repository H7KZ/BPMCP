# App stack for one environment
# shipped to ~/mcp/<env>/ and driven by deploy.sh

services:
  docs:
    image: ${DOCS_IMAGE_NAME}:${IMAGE_TAG}
    restart: unless-stopped

    environment:
      PORT: "80"

    networks:
      - traefik-network

    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:80/" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik-network'
      # Catch-all: humans and every non-MCP GET
      # Lowest priority so the mcp router below wins its routes
      - 'traefik.http.routers.docs-${ENV}.rule=Host(`${DOMAIN}`)'
      - 'traefik.http.routers.docs-${ENV}.priority=1'
      - 'traefik.http.routers.docs-${ENV}.entrypoints=websecure'
      - 'traefik.http.routers.docs-${ENV}.tls=true'
      - 'traefik.http.routers.docs-${ENV}.tls.certresolver=le'
      - 'traefik.http.services.docs-${ENV}.loadbalancer.server.port=80'

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mcp:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    restart: unless-stopped
    profiles: [ mcp ]

    environment:
      NODE_ENV: production
      PORT: "3000"
      METRICS_PORT: "9090"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

    depends_on:
      redis:
        condition: service_healthy

    networks:
      traefik-network: { }
      redis-network: { }
      metrics-network:
        aliases:
          - mcp-${ENV}

    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik-network'
      # High priority
      # the bare-origin POST endpoint plus the auth/discovery and health routes
      # Everything else falls through to the docs catch-all
      - 'traefik.http.routers.mcp-${ENV}.rule=Host(`${DOMAIN}`) && (Method(`POST`) || PathPrefix(`/.well-known`) || PathPrefix(`/oauth`) || Path(`/health`))'
      - 'traefik.http.routers.mcp-${ENV}.priority=100'
      - 'traefik.http.routers.mcp-${ENV}.entrypoints=websecure'
      - 'traefik.http.routers.mcp-${ENV}.tls=true'
      - 'traefik.http.routers.mcp-${ENV}.tls.certresolver=le'
      - 'traefik.http.services.mcp-${ENV}.loadbalancer.server.port=3000'

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8.10.0
    restart: unless-stopped
    profiles: [ mcp ]

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"

    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}

    networks:
      - redis-network

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik-network:
    name: traefik-network
    external: true

  redis-network:
    name: redis-network
    driver: bridge

  metrics-network:
    name: metrics-network
    external: true
